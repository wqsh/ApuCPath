      - name: Extract 7z Archive
        run: |
          ls
          # 查找第一个 .7z 文件（如果有多个，只取第一个）
          FILE=$(ls *.7z 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "❌ 当前目录没有找到 .7z 文件！"
            exit 1
          fi
          echo "📦 正在解压 $FILE ..."
          7z x "$FILE" -y -o./extracted/
          # 解压成功后删除原文件（可选）
          rm -f "$FILE"
          echo "✅ 解压完成，内容位于 ./extracted/"

      - name: Collect UNI
        run: |
          cp -v -r ./extracted/. ./ApuCPath_Windows
          
      - name: Download asset from ApuCPathUI_Windows
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "wqsh/ApuCPath-code"
          tag: "ApuCPathUI_Windows"
          fileName: "*.7z.*"
          token: ${{ secrets.APUCPATHPUBLISH }} # 使用具有 repo 权限的 PAT

      - name: Extract 7z ApuCPathUI_Windows
        run: |
          # 文件就在当前目录，查找 .7z.001 文件
          FIRST_VOLUME=$(ls *.7z.001 2>/dev/null | head -1)
          if [ -z "$FIRST_VOLUME" ]; then
            echo "❌ No .7z.001 file found!"
            exit 1
          fi
          echo "📦 Extracting $FIRST_VOLUME ..."
          7z x "$FIRST_VOLUME" -y -o./extracted/
          # 解压成功后删除分卷文件（可选）
          rm -f *.7z.*
          
      - name: Collect UI
        run: |
          cp -v -r ./extracted/ApuCPathEXE/. ./ApuCPath_Windows
          

      - name: 7z
        run: |
          7z a -v1000m ApuCPath_Windows.7z ./ApuCPath_Windows

      - name: 发布至release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.APUCPATHPUBLISH }}
          tag_name: "ApuCPath_Windows"
          name: "ApuCPath_Windows"
          files: |
            ./ApuCPath_Windows.7z.*
          draft: false
          prerelease: true
